<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #fdfaf5;
            --text-main: #142214;
            --text-secondary: #3d4a3d;
            --accent: #1a301a;
            --border: #e0e8e0;
            --radius: 2px;
            --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            width: 280px;
            padding: 24px 20px;
            background: var(--bg);
            color: var(--text-main);
            font-family: var(--font);
            margin: 0;
            line-height: 1.4;
        }

        h3 {
            margin: 0 0 20px 0;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            background: #fff !important;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 13px;
            color: var(--text-main) !important;
            outline: none;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%231a301a%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C/polyline%3E%3C/svg%3E');
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 12px;
            transition: border-color 150ms ease;
        }

        select:focus {
            border-color: var(--accent);
        }

        .actions {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            font-family: var(--font);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            border-radius: var(--radius);
            transition: all 150ms ease;
        }

        #save {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        #save:hover {
            background: rgba(26, 48, 26, 0.05);
        }

        #explain {
            background: var(--accent);
            color: #fff;
            border: 1px solid var(--accent);
        }

        #explain:hover {
            background: #142214;
            border-color: #142214;
        }

        .status {
            margin-top: 16px;
            font-size: 11px;
            color: var(--accent);
            text-align: center;
            font-weight: 500;
            min-height: 15px;
        }
    </style>
</head>

<body>
    <h3>CogniLens Settings</h3>

    <div class="setting-group">
        <label for="syllabus">Curriculum</label>
        <select id="syllabus">
            <option value="IB">IB Framework</option>
            <option value="AP">Advanced Placement</option>
            <option value="IGCSE">IGCSE Standard</option>
        </select>
    </div>

    <div class="setting-group">
        <label for="mode">Instruction Mode</label>
        <select id="mode">
            <option value="concept">Concept Analysis</option>
            <option value="guided">Guided Problem Solving</option>
            <option value="concise">Abridged Summary</option>
            <option value="detailed">In-depth Exploration</option>
        </select>
    </div>

    <div class="setting-group">
        <label for="depth">Academic Depth</label>
        <select id="depth">
            <option value="high">Formal (High)</option>
            <option value="low">Standard (Low)</option>
        </select>
    </div>

    <div class="setting-group">
        <label for="language">Language</label>
        <select id="language">
            <option value="English">English</option>
            <option value="Spanish">Spanish</option>
            <option value="French">French</option>
            <option value="Japanese">Japanese</option>
            <option value="Chinese">Chinese</option>
        </select>
    </div>

    <div class="actions">
        <button id="save">Save Preferences</button>
        <button id="explain">Analyze Selection</button>
    </div>

    <div id="status" class="status"></div>

    <script src="popup.js"></script>
</body>

</html>
